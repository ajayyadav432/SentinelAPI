name: SentinelAPI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic pyyaml python-multipart websockets pytest pytest-asyncio

      - name: Run SentinelAPI Backend Tests
        run: |
          export PYTHONPATH=.
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          pytest tests/test_full_suite.py -v

      - name: Test SentinelAPI CI Security Gate CLI
        run: |
          export PYTHONPATH=.
          python -m backend.cli --spec backend/sandbox/crapi_openapi.yaml --target http://127.0.0.1:8000/sandbox-target --output ci-report.json || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build
